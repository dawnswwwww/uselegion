legion-protocol = { path = "../legion-protocol", version = "0.0.1-rc.1" }
legion-provider = { path = "../legion-provider", version = "0.0.1-rc.1" }
legion-runtime = { path = "../legion-runtime", version = "0.0.1-rc.1" }
legion-skills = { path = "../legion-skills", version = "0.0.1-rc.1" }
legion-tools = { path = "../legion-tools", version = "0.0.1-rc.1" }
