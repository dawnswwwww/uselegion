[package]
name = "legion-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
legion-core = { path = "../legion-core", version = "0.0.1-rc.1" }
legion-plugin-sdk = { path = "../legion-plugin-sdk", version = "0.0.1-rc.1" }
legion-provider = { path = "../legion-provider", version = "0.0.1-rc.1" }
legion-runtime = { path = "../legion-runtime", version = "0.0.1-rc.1" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
sqlite-vec = "0.1"
# `bundled` compiles SQLite from source and statically links it, so distributed
# binaries need no system libsqlite3 (required for portable musl/darwin builds).
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
