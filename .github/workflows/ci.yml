name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Avoid MSRV-pinned transitive crates drifting during CI.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + build + clippy + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.86)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          # bundled SQLite + sqlite-vec compile from source, but pkg-config and
          # a C toolchain are still required by the build scripts.
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -- --check

      - name: Build all targets
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets
