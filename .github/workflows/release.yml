name: release

# Triggered by a pushed `v*.*.*` tag. Builds the `legion` + `legion-gateway`
# binaries for 5 targets, publishes a GitHub Release, signs a release manifest
# (consumed by `legion gateway install`), and publishes to crates.io, Homebrew,
# and npm.
#
# Required repository secrets:
#   CARGO_REGISTRY_TOKEN       — crates.io publish token
#   NPM_TOKEN                  — npm automation token (org: uselegion)
#   LEGION_RELEASE_SIGNING_KEY — 64-hex-char Ed25519 seed for manifest signing
#   HOMEBREW_TAP_TOKEN         — PAT with repo scope on dawnswwwww/homebrew-tap
#
# External prerequisites (one-time setup, see docs/release-signing-key.md):
#   - npm org `uselegion` created
#   - GitHub repo `dawnswwwww/homebrew-tap` created (with Formula/ skeleton)
#   - GitHub repo branch `releases/stable` created (manifest host)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # upload release assets

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. Verify the tag matches the Cargo workspace version.
  # ──────────────────────────────────────────────────────────────────────
  version-check:
    name: version check
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag to Cargo.toml version
        id: check
        run: |
          TAG="${GITHUB_REF_NAME#v}"            # strip leading 'v'
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "tag (stripped): $TAG"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::tag '$TAG' does not match Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────
  # 2. Build matrix: one job per target triple.
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.target }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-apple-darwin
            # macos-13 was retired 2025-12; macos-15-intel is the last Intel
            # macOS image (available until 2027-08).
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    env:
      # musl C toolchain wiring (inert on non-musl targets): C sources are
      # compiled with musl-gcc (apt musl-tools) for x86_64 and the Bootlin
      # cross gcc for aarch64.
      # Linking is asymmetric on purpose:
      # - x86_64 keeps the default rust-lld self-contained link (static-pie);
      #   Debian's musl-gcc spec would force a dynamic /lib/ld-musl loader.
      # - aarch64 must override the linker: rust drives host `cc` there, which
      #   cannot link aarch64 objects. Bootlin's gcc honors -static.
      CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: /opt/aarch64--musl--stable-2024.05-1/bin/aarch64-linux-gcc
      CC_aarch64_unknown_linux_musl: /opt/aarch64--musl--stable-2024.05-1/bin/aarch64-linux-gcc
      # sqlite-vec 0.1.9 typedefs u_int8_t/16/64 without <sys/types.h>, which
      # musl headers reject. Macro-aliasing them to the stdint types turns the
      # typedefs into legal C11 same-type redefinitions. Plain -D flags (unlike
      # `-include`) are also safe when cc-rs assembles ring's .S files.
      CFLAGS_x86_64_unknown_linux_musl: -Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t
      CFLAGS_aarch64_unknown_linux_musl: -Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential musl-tools

      # aarch64 musl has no apt toolchain on x86_64 runners; use the prebuilt
      # Bootlin cross compiler (x86_64 musl is covered by musl-tools above).
      # Bootlin is used instead of musl.cc because musl.cc is unreachable from
      # GitHub-hosted runners (connect timeout).
      - name: Install aarch64 musl cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          curl -sSfL --retry 3 --connect-timeout 30 \
            https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2024.05-1.tar.xz \
            | sudo tar -xJ -C /opt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build legion-cli
        shell: bash
        run: |
          # Capture build log to an artifact on failure so we can diagnose
          # cross-compile errors without authenticated log access.
          set -o pipefail
          if ! cargo build --release --target ${{ matrix.target }} -p uselegion-cli 2>&1 | tee build-cli.log; then
            echo "::warning::build failed; see build-cli.log artifact"
            exit 1
          fi

      - name: Upload build log on failure (diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ matrix.target }}
          path: build-cli.log
          retention-days: 7

      - name: Build legion-gateway
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p uselegion-gateway

      - name: Stage binaries + docs
        shell: bash
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGE="legion-${VERSION}-${TARGET}"
          mkdir -p "$STAGE"
          BUILDDIR="target/${TARGET}/release"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            cp "$BUILDDIR/legion.exe" "$STAGE/"
            cp "$BUILDDIR/legion-gateway.exe" "$STAGE/"
          else
            cp "$BUILDDIR/legion" "$STAGE/"
            cp "$BUILDDIR/legion-gateway" "$STAGE/"
          fi
          cp LICENSE "$STAGE/"
          cp README.md "$STAGE/"
          echo "$STAGE"

      - name: Verify static linking (Linux musl)
        if: contains(matrix.target, 'unknown-linux-musl')
        run: |
          # Portable release binaries must be fully static: a dynamic
          # /lib/ld-musl*.so.1 interpreter means the binary only runs where
          # musl is installed. Fail the build rather than ship that.
          for bin in legion legion-gateway; do
            out=$(file target/${{ matrix.target }}/release/$bin)
            echo "$out"
            case "$out" in
              *"statically linked"*|*"static-pie linked"*) ;;
              *) echo "::error::$bin is not statically linked"; exit 1 ;;
            esac
          done

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGE="legion-${VERSION}-${TARGET}"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          # Portable sha256: macOS lacks coreutils sha256sum, so use shasum.
          shasum -a 256 "${STAGE}.tar.gz" | awk '{print $1}' > "${STAGE}.tar.gz.sha256"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        # bash (Git Bash on windows runners): the previous pwsh variant
        # silently produced no .sha256 sidecar, which later broke
        # build-manifest.mjs. ls at the end makes the step self-verifying.
        shell: bash
        run: |
          set -euo pipefail
          command -v 7z >/dev/null || 7z() { "/c/Program Files/7-Zip/7z.exe" "$@"; }
          VERSION="${{ needs.version-check.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGE="legion-${VERSION}-${TARGET}"
          7z a -tzip "${STAGE}.zip" "$STAGE" >/dev/null
          sha256sum "${STAGE}.zip" | awk '{print $1}' > "${STAGE}.zip.sha256"
          ls -la "${STAGE}.zip" "${STAGE}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            legion-*.tar.gz
            legion-*.tar.gz.sha256
            legion-*.zip
            legion-*.zip.sha256
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # 3. Create the GitHub Release and upload all assets.
  # ──────────────────────────────────────────────────────────────────────
  github-release:
    name: github release
    needs: [version-check, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: legion ${{ needs.version-check.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          # Mark as prerelease if the version contains a hyphen (e.g. 0.0.1-rc.1).
          prerelease: ${{ contains(needs.version-check.outputs.version, '-') }}
          files: |
            dist/legion-*.tar.gz
            dist/legion-*.tar.gz.sha256
            dist/legion-*.zip
            dist/legion-*.zip.sha256
          body: |
            ## Install

            **macOS** (Apple Silicon / Intel):
            ```bash
            brew install dawnswwwww/tap/legion
            ```

            **npm** (any platform):
            ```bash
            npm install -g @uselegion/cli
            ```

            **Cargo**:
            ```bash
            cargo install uselegion-cli
            ```

            **Direct download**: grab the archive for your platform below,
            extract, and put `legion` on your `PATH`.

            See the full release notes below.

  # ──────────────────────────────────────────────────────────────────────
  # 4. Build + sign the release manifest (for `legion gateway install`).
  # ──────────────────────────────────────────────────────────────────────
  manifest-sign:
    name: sign manifest
    needs: [version-check, github-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build manifest JSON
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          node scripts/build-manifest.mjs "$VERSION" dist > manifest.json
          echo "--- manifest.json ---"
          cat manifest.json

      - name: Sign manifest
        env:
          LEGION_RELEASE_SIGNING_KEY: ${{ secrets.LEGION_RELEASE_SIGNING_KEY }}
        run: |
          node scripts/sign-manifest.mjs manifest.json manifest.json.sig
          echo "--- signature ---"
          cat manifest.json.sig | xxd -p -c 64

      - name: Upload manifest + sig to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            manifest.json
            manifest.json.sig

      - name: Publish manifest to stable channel branch
        # Pushes manifest.json + .sig to the `releases/stable` branch, which is
        # the well-known host the CLI fetches (STABLE_MANIFEST_URL in lib.rs).
        # Uses an isolated shallow clone so the tag checkout above is untouched.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          rm -rf manifest-host
          git clone --depth=1 -b releases/stable \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            manifest-host 2>/dev/null || {
              # Branch doesn't exist yet — create it as an orphan.
              mkdir -p manifest-host
              git init -q manifest-host
              (cd manifest-host && git checkout -q --orphan releases/stable)
            }
          cp manifest.json manifest-host/
          cp manifest.json.sig manifest-host/
          cd manifest-host
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json manifest.json.sig
          git commit -m "chore: publish stable manifest for v${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:releases/stable

  # ──────────────────────────────────────────────────────────────────────
  # 5. Publish all crates to crates.io (topological order).
  # ──────────────────────────────────────────────────────────────────────
  publish-crates:
    name: crates.io
    needs: [version-check, github-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-crates

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Publish leaves-first so dependents resolve. Only the exact
          # "already uploaded/exists" case is tolerated; crates.io rate-limits
          # first-time crate registrations (429 with a retry-after), so wait
          # out the stated window and retry; every other error fails loudly.
          publish() {
            echo "::group::cargo publish -p $1"
            local attempt out wait_until now then_epoch secs
            for attempt in 1 2 3 4 5 6; do
              if out=$(cargo publish -p "$1" --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
                echo "$out"
                echo "::endgroup::"
                return 0
              fi
              echo "$out"
              if echo "$out" | grep -qE "already (uploaded|exists)"; then
                echo "  (already published: $1)"
                echo "::endgroup::"
                return 0
              fi
              if echo "$out" | grep -q "429 Too Many Requests"; then
                wait_until=$(echo "$out" | sed -n 's/.*try again after \(.*\) and see.*/\1/p' | head -1)
                now=$(date -u +%s)
                then_epoch=$(date -u -d "$wait_until" +%s 2>/dev/null || echo $((now + 300)))
                secs=$((then_epoch - now + 15))
                [ "$secs" -lt 60 ] && secs=60
                echo "  rate-limited by crates.io; sleeping ${secs}s (attempt $attempt/6)"
                sleep "$secs"
                continue
              fi
              echo "::error::publish failed for $1"
              exit 1
            done
            echo "::error::publish failed for $1 after 6 attempts"
            exit 1
          }
          # Topological order (verified against each crate's internal deps).
          # Notably: plugin-sdk needs skills; host must be published because
          # gateway and cli depend on it.
          publish uselegion-core
          publish uselegion-skills
          publish uselegion-telemetry
          publish uselegion-mcp
          publish uselegion-web
          publish uselegion-plugin-sdk
          publish uselegion-provider
          publish uselegion-protocol
          publish uselegion-runtime
          publish uselegion-automation
          publish uselegion-channel
          publish uselegion-acp
          publish uselegion-memory
          publish uselegion-tools
          publish uselegion-host
          publish uselegion-gateway
          publish uselegion-cli   # last: depends on all of the above

  # ──────────────────────────────────────────────────────────────────────
  # 6. Update the Homebrew tap formula.
  # ──────────────────────────────────────────────────────────────────────
  publish-homebrew:
    name: homebrew tap
    needs: [version-check, github-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download darwin artifacts (for sha256)
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: dist-*-apple-darwin

      - name: Render + push formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          ARM64_SHA=$(cat dist/legion-*-aarch64-apple-darwin.tar.gz.sha256)
          X64_SHA=$(cat dist/legion-*-x86_64-apple-darwin.tar.gz.sha256 || echo "placeholder")
          echo "arm64 sha: $ARM64_SHA"
          echo "x64 sha: $X64_SHA"

          # Render the formula from the template committed in this repo.
          mkdir -p out
          sed \
            -e "s|@@VERSION@@|${VERSION}|g" \
            -e "s|@@ARM64_SHA@@|${ARM64_SHA}|g" \
            -e "s|@@X64_SHA@@|${X64_SHA}|g" \
            Formula/legion.rb.tpl > out/legion.rb

          # Clone the tap, copy the formula, commit, push.
          rm -rf homebrew-tap
          gh repo clone dawnswwwww/homebrew-tap homebrew-tap \
            -- --depth=1 || git clone "https://x-access-token:${GH_TOKEN}@github.com/dawnswwwww/homebrew-tap.git" homebrew-tap
          cd homebrew-tap
          mkdir -p Formula
          cp ../out/legion.rb Formula/legion.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/legion.rb
          git commit -m "legion ${VERSION}"
          git push https://x-access-token:${GH_TOKEN}@github.com/dawnswwwww/homebrew-tap.git HEAD:main

  # ──────────────────────────────────────────────────────────────────────
  # 7. Publish npm packages (main + 5 platform packages).
  # ──────────────────────────────────────────────────────────────────────
  publish-npm:
    name: npm
    needs: [version-check, github-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Stage platform binaries into npm packages
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          # Map each target triple to its npm platform package directory.
          declare -A MAP=(
            [aarch64-apple-darwin]=npm/platform-darwin-arm64
            [x86_64-apple-darwin]=npm/platform-darwin-x64
            [aarch64-unknown-linux-musl]=npm/platform-linux-arm64-musl
            [x86_64-unknown-linux-musl]=npm/platform-linux-x64-musl
            [x86_64-pc-windows-msvc]=npm/platform-win32-x64-msvc
          )
          for target in "${!MAP[@]}"; do
            pkg="${MAP[$target]}"
            mkdir -p "$pkg/bin"
            src_glob="dist/legion-${VERSION}-${target}.*"
            # Pick the archive (tar.gz or zip), not the .sha256.
            archive=$(ls ${src_glob} | grep -v sha256 | head -1)
            # Extract the raw binaries into bin/ — no postinstall extraction
            # needed at install time (matches the esbuild/biome approach).
            extract_dir="/tmp/extract-${target}"
            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"
            case "$archive" in
              *.tar.gz|*.tgz)
                tar -xzf "$archive" -C "$extract_dir"
                mv "$extract_dir"/legion-*/legion "$pkg/bin/"
                mv "$extract_dir"/legion-*/legion-gateway "$pkg/bin/"
                ;;
              *.zip)
                # Windows archive: unzip, keep .exe suffix.
                7z x -o"$extract_dir" "$archive"
                mv "$extract_dir"/legion-*/legion.exe "$pkg/bin/"
                mv "$extract_dir"/legion-*/legion-gateway.exe "$pkg/bin/"
                ;;
            esac
          done
          # Stamp version into every package.json. The main package's
          # optionalDependencies must be pinned to the same version —
          # otherwise npm silently skips the platform packages (unresolvable
          # optional deps are not fatal) and the wrapper installs with no
          # binary.
          for pj in npm/*/package.json; do
            python3 - "$pj" "$VERSION" <<'PY'
          import json, sys
          f, ver = sys.argv[1], sys.argv[2]
          d = json.load(open(f))
          d["version"] = ver
          if "optionalDependencies" in d:
              d["optionalDependencies"] = {k: ver for k in d["optionalDependencies"]}
          json.dump(d, open(f, "w"), indent=2)
          print(f"stamped {f} -> {ver}")
          PY
          done

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Only "cannot publish over the existing version" is tolerated;
          # any other error (missing scope, bad token) fails loudly.
          for pkg in npm/platform-*/; do
            echo "::group::npm publish $pkg"
            if ! out=$(cd "$pkg" && npm publish --access public 2>&1); then
              echo "$out"
              echo "$out" | grep -qiE "cannot publish over|EPUBLISHCONFLICT" || exit 1
              echo "  (already published: $pkg)"
            fi
            echo "::endgroup::"
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if ! out=$(cd npm/cli && npm publish --access public 2>&1); then
            echo "$out"
            echo "$out" | grep -qiE "cannot publish over|EPUBLISHCONFLICT" || exit 1
            echo "  (already published: npm/cli)"
          fi
